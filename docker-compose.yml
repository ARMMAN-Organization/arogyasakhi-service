# Local development dependencies. Application services run via `nx serve <app>`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: armman
      POSTGRES_PASSWORD: armman
      POSTGRES_DB: arogya
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U armman']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
