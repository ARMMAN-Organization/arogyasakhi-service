name: CD Dev (SSM Run Command)

# Redeploys the dev box with only the services whose code changed, over
# `aws ssm send-command`. No inbound port, and no long-lived AWS credentials:
# GitHub mints an OIDC token per run and exchanges it for short-lived ones.
#
# WHY RUN COMMAND AND NOT AN SSH TUNNEL
# The deploy role is permitted `ssm:SendCommand` only. Session Manager's SSH
# tunnel (AWS-StartSSHSession) would have let this keep using ssh/scp unchanged,
# but that permission was declined, so Run Command is the available transport.
#
# WHERE THE LOGIC LIVES
# tools/deploy-dev.sh, on the box — and ONLY on the box. It is gitignored and
# placed there by hand, so it is neither versioned nor reviewed, and `git reset
# --hard` below leaves it untouched (as it does .env and ecosystem.config.js).
# The box's copy is authoritative: changes must be copied across manually, and a
# rebuilt box needs it restored before deploys work. Each job checks it is
# present and fails with a named error if not.
#
# Run Command has no stdin, so the alternative was embedding the whole deploy in
# this YAML as a command array — unreviewable either way, and it would put the
# logic in the API payload on every run. A script keeps each command to one line
# and stays transport-agnostic, so it survives a move back to ssh later.
#
# ROOT vs ssm-user
# Run Command executes as root in a non-login shell. PM2's daemon is per-user, so
# as root `pm2 describe` finds nothing and every reload fails with "process not
# found"; the box also resolves Node 24 through ssm-user's profile, so `npx nx`
# is only on PATH under `bash -l`. Everything touching git, pm2 or nx therefore
# runs via `runuser -l ssm-user`. Only the .env write stays as root, then chowns.
#
# .env HANDLING — DELIBERATE, NOT AN OVERSIGHT
# Run Command has no file copy, so each service's .env body travels inside the
# command document. It is therefore readable by any principal holding
# `ssm:GetCommandInvocation` and is retained in SSM command history. This was
# raised and accepted for this dev box. It is written with a heredoc redirect
# rather than as an argument, so it at least never appears in `ps` on the box.
# If that trade is ever revisited: hold the bodies in Parameter Store
# SecureString and let the instance profile read them, so they never transit the
# command payload at all.
#
# WHY THE LOGIC RUNS ON THE BOX, NOT THE RUNNER
# Affected-detection needs Nx and node_modules. The box already has both, so the
# runner stays a thin driver and we skip a ~3min `npm ci` on every deploy. The
# runner never checks the repo out at all.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      services:
        description: 'Empty = only what changed. "all", or a comma-separated list of service names.'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      services:
        description: 'Empty = only what changed. "all", or a comma-separated list of service names.'
        type: string
        required: false
        default: ''

# id-token is what configure-aws-credentials exchanges for short-lived AWS
# credentials via OIDC federation — no access keys are stored anywhere. Mirrored
# in redeploy-dev.yml, because a reusable workflow cannot grant itself more token
# permission than its caller.
permissions:
  contents: read
  id-token: write

# Never cancel a deploy in flight, and never run two at once: both would race
# `git reset --hard` in the same directory on the same box. Queue instead.
#
# Shares the group with cd-dev-ssh.yml deliberately, so a test of this path
# cannot reset the same working tree as a push deploy.
concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  DEV_WORKSPACE: ${{ vars.DEV_WORKSPACE || '/opt/dev/armaan/arogyasakhi-service' }}
  DEV_USER: ${{ secrets.DEV_USER || 'ssm-user' }}
  # PM2 runs the services via `nx serve` in fork mode, so a reload restarts a
  # webpack dev server that must rebuild before it listens. Measured at 12s for
  # auth-service on an otherwise-quiet box; the margin covers a shared-lib change
  # having every watcher rebuild at once on a contended box.
  HEALTH_TIMEOUT_SECONDS: 120
  # Run Command is asynchronous, so completion is polled. `aws ssm wait
  # command-executed` is deliberately not used: it gives up after roughly 100s
  # (5s x 20 attempts), and the detect step alone runs an Nx build.
  POLL_ATTEMPTS: 240
  POLL_DELAY: 5
  # Execution budget on the box, passed to the document — comfortably above a
  # cold Nx build plus the health wait.
  SSM_EXECUTION_TIMEOUT: 3600

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Sync workspace and resolve services to deploy
        id: resolve
        env:
          DEV_INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
          SERVICES_INPUT: ${{ inputs.services }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "${DEV_INSTANCE_ID:-}" ] || { echo "::error::Variable DEV_INSTANCE_ID is empty or unset."; exit 1; }

          # Send a script file as the document's `commands`, poll to completion,
          # then write stdout to $3. Built with jq --rawfile rather than shell
          # interpolation so any content survives, quotes included. Output is not
          # piped, because a pipeline's exit status would mask a failed command.
          ssm_run() {
            local script_file=$1 label=$2 out=$3 cid status=Pending
            jq -n --rawfile s "$script_file" --arg t "$SSM_EXECUTION_TIMEOUT" \
              '{commands: ($s | rtrimstr("\n") | split("\n")), executionTimeout: [$t]}' > params.json
            cid=$(aws ssm send-command \
                  --instance-ids "$DEV_INSTANCE_ID" \
                  --document-name AWS-RunShellScript \
                  --comment "cd-dev ${label:0:80}" \
                  --parameters file://params.json \
                  --query Command.CommandId --output text)
            echo "SSM command id: $cid"
            for _ in $(seq 1 "$POLL_ATTEMPTS"); do
              status=$(aws ssm get-command-invocation --command-id "$cid" \
                       --instance-id "$DEV_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep "$POLL_DELAY"
            done
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$DEV_INSTANCE_ID" \
              --query StandardErrorContent --output text || true
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$DEV_INSTANCE_ID" \
              --query StandardOutputContent --output text > "$out"
            cat "$out"
            [ "$status" = Success ] || { echo "::error::SSM command $cid ended as $status ($label)."; return 1; }
          }

          # HEAD is captured before the reset, and the reset runs here rather than
          # inside deploy-dev.sh: the script on disk is the previous version until
          # the reset lands, so it has to run afterwards. bash reads it after the
          # reset completes, so the new copy is what executes.
          #
          # git runs as ssm-user, never root — root git operations in a
          # ssm-user-owned repo trip "dubious ownership" and leave root-owned
          # objects behind.
          #
          # Values are prefixed with %q and the body is a quoted heredoc, so
          # nothing expands on the runner by accident and no quoting can break.
          # `set -eu`, not `-euo pipefail`: AWS-RunShellScript executes the
          # commands with /bin/sh, which on Ubuntu is dash — it rejects
          # `-o pipefail` outright ("Illegal option"), failing on line 1. The
          # outer wrapper is therefore kept POSIX; the inner script below runs
          # under `bash -s` and keeps full pipefail.
          {
            printf 'set -eu\n'
            printf "runuser -l %q -c 'bash -s' <<'INNER'\n" "$DEV_USER"
            printf 'set -euo pipefail\n'
            printf 'WORKSPACE=%q\n' "$DEV_WORKSPACE"
            printf 'REF_NAME=%q\n'  "$REF_NAME"
            printf 'REQUESTED=%q\n' "${SERVICES_INPUT:-}"
            cat <<'INNER_BODY'
          cd "$WORKSPACE"
          if [ ! -f tools/deploy-dev.sh ]; then
            echo "MISSING_DEPLOY_SCRIPT"
            exit 1
          fi
          base=$(git rev-parse HEAD)
          git fetch origin "$REF_NAME"
          # No `git clean` anywhere: the box legitimately holds untracked files
          # (ecosystem.config.js — PM2's own config — the .env files, notes).
          git reset --hard FETCH_HEAD
          DEV_WORKSPACE="$WORKSPACE" bash tools/deploy-dev.sh detect "$base" "$REQUESTED"
          INNER_BODY
            printf 'INNER\n'
          } > script.sh

          ssm_run script.sh detect remote.out || {
            if grep -q '^MISSING_DEPLOY_SCRIPT' remote.out; then
              echo "::error::tools/deploy-dev.sh is not present at $DEV_WORKSPACE on the box. It is gitignored and maintained by hand, so a rebuilt box or a wiped workspace needs it copied back before deploys work."
            fi
            exit 1
          }

          if grep -q '^LOCKFILE_CHANGED=1' remote.out; then
            echo "::error::package-lock.json changed. npm ci is deliberately not run here on every deploy (see the WHY THE LOGIC RUNS ON THE BOX comment above) — but a changed lockfile means a dependency may be missing from the box's node_modules, which fails the build at runtime instead of here (e.g. node-cron, 2026-09-02). Run 'npm ci' on the box in \$DEV_WORKSPACE, then re-run this deploy."
            exit 1
          fi
          if grep -q '^UNKNOWN=' remote.out; then
            echo "::error::Unknown service(s): $(sed -n 's/^UNKNOWN=//p' remote.out)"
            exit 1
          fi
          sed -n 's/^GENERATED=/Regenerated Prisma client for /p' remote.out

          apps=$(sed -n 's/^APPS_JSON=//p' remote.out)
          [ -n "$apps" ] || { echo "::error::Could not resolve the app list."; exit 1; }

          count=$(jq 'length' <<<"$apps")
          echo "Deploying ($count): $(jq -r 'join(", ")' <<<"$apps")"

          # env_secret is derived here because GitHub expressions have no
          # upper-casing function and so cannot turn "auth-service" into
          # ENV_AUTH_SERVICE on their own.
          matrix=$(jq -c '{
            include: [ .[] | {
              service: .,
              env_secret: ("ENV_" + (. | ascii_upcase | gsub("-"; "_")))
            } ]
          }' <<<"$apps")

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # Sequential: the box sits near 81% RAM with everything idle, so parallel
      # webpack rebuilds risk an OOM. fail-fast off so one bad service does not
      # strand the rest un-deployed.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Write .env, migrate and reload
        env:
          ENV_BODY: ${{ secrets[matrix.env_secret] }}
          DEV_INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
          SVC: ${{ matrix.service }}
        run: |
          set -euo pipefail
          [ -n "${DEV_INSTANCE_ID:-}" ] || { echo "::error::Variable DEV_INSTANCE_ID is empty or unset."; exit 1; }

          # Duplicated from the detect job. Kept inline rather than extracted to a
          # composite action, because a local action resolves from the workspace
          # and would force actions/checkout into a workflow that deliberately
          # never checks out (see the header).
          ssm_run() {
            local script_file=$1 label=$2 out=$3 cid status=Pending
            jq -n --rawfile s "$script_file" --arg t "$SSM_EXECUTION_TIMEOUT" \
              '{commands: ($s | rtrimstr("\n") | split("\n")), executionTimeout: [$t]}' > params.json
            cid=$(aws ssm send-command \
                  --instance-ids "$DEV_INSTANCE_ID" \
                  --document-name AWS-RunShellScript \
                  --comment "cd-dev ${label:0:80}" \
                  --parameters file://params.json \
                  --query Command.CommandId --output text)
            echo "SSM command id: $cid"
            for _ in $(seq 1 "$POLL_ATTEMPTS"); do
              status=$(aws ssm get-command-invocation --command-id "$cid" \
                       --instance-id "$DEV_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep "$POLL_DELAY"
            done
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$DEV_INSTANCE_ID" \
              --query StandardErrorContent --output text || true
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$DEV_INSTANCE_ID" \
              --query StandardOutputContent --output text > "$out"
            cat "$out"
            [ "$status" = Success ] || { echo "::error::SSM command $cid ended as $status ($label)."; return 1; }
          }

          # The .env write runs as root, then chowns — writing it as ssm-user
          # would mean passing the body through `runuser -c`, where it would show
          # up in `ps` for every user on the box. A quoted heredoc delimiter stops
          # anything inside the body being expanded, so $(...), backticks and
          # quotes all survive verbatim. The one thing that would break out is a
          # body line exactly matching the delimiter:
          if printf '%s' "${ENV_BODY:-}" | grep -qx 'AROGYA_ENV_EOF'; then
            echo "::error::$SVC: ${{ matrix.env_secret }} contains a line reading exactly AROGYA_ENV_EOF, which would terminate the heredoc early and truncate the .env. Rename or remove that line."
            exit 1
          fi

          # `set -eu`, not `-euo pipefail` — see the detect job: the outer script
          # is run by /bin/sh (dash), which rejects `-o pipefail`. The inner
          # script runs under `bash -s` and keeps it.
          {
            printf 'set -eu\n'
            printf 'cd %q\n' "$DEV_WORKSPACE"
            if [ -n "${ENV_BODY:-}" ]; then
              printf 'umask 077\n'
              printf "cat > apps/%q/.env <<'AROGYA_ENV_EOF'\n" "$SVC"
              printf '%s\n' "$ENV_BODY"
              printf 'AROGYA_ENV_EOF\n'
              printf 'chown %q:%q apps/%q/.env\n' "$DEV_USER" "$DEV_USER" "$SVC"
              printf 'chmod 600 apps/%q/.env\n' "$SVC"
              printf 'echo ENV_WRITTEN\n'
            fi
            printf "runuser -l %q -c 'bash -s' <<'INNER'\n" "$DEV_USER"
            printf 'set -euo pipefail\n'
            printf 'WORKSPACE=%q\n' "$DEV_WORKSPACE"
            printf 'SVC=%q\n'       "$SVC"
            printf 'TIMEOUT=%q\n'   "$HEALTH_TIMEOUT_SECONDS"
            cat <<'INNER_BODY'
          cd "$WORKSPACE"
          DEV_WORKSPACE="$WORKSPACE" HEALTH_TIMEOUT_SECONDS="$TIMEOUT" \
            bash tools/deploy-dev.sh deploy "$SVC"
          INNER_BODY
            printf 'INNER\n'
          } > script.sh

          if [ -z "${ENV_BODY:-}" ]; then
            echo "::warning::$SVC: secret ${{ matrix.env_secret }} is not set — reloading against the .env already on the box."
          fi

          # Markers are checked below, so a non-zero status here is expected for
          # the handled cases and must not abort the step first.
          ssm_run script.sh "deploy $SVC" remote.out || true

          if grep -q '^MISSING_DEPLOY_SCRIPT' remote.out; then
            echo "::error::tools/deploy-dev.sh is not present at $DEV_WORKSPACE on the box. It is gitignored and maintained by hand, so a rebuilt box or a wiped workspace needs it copied back before deploys work."
            exit 1
          fi
          if grep -q '^ENV_WRITTEN' remote.out; then
            echo "Wrote apps/$SVC/.env from ${{ matrix.env_secret }}"
          fi
          if grep -q '^NO_ENV' remote.out; then
            echo "::error::$SVC: apps/$SVC/.env is missing on the box, so the database target is unknown. Set the ${{ matrix.env_secret }} secret."
            exit 1
          fi
          if grep -q '^MISSING_ENV' remote.out; then
            echo "::error::$SVC: $(sed -n 's/^MISSING_ENV //p' remote.out) is not set in apps/$SVC/.env — add it to the ${{ matrix.env_secret }} secret. The schema declares both url and directUrl, so DATABASE_URL and DIRECT_URL are both required."
            exit 1
          fi
          if grep -q '^MIGRATE_FAILED' remote.out; then
            echo "::error::$SVC: prisma migrate deploy failed — see the log tail above. Prisma has no down-migrations, so a bad migration is fixed forward, not rolled back."
            exit 1
          fi
          if grep -q '^SKIPPED_NOT_IN_PM2' remote.out; then
            echo "::warning::$SVC is not registered in PM2 — skipped. Bootstrap it once on the box with pm2 start, then it will deploy normally."
            exit 0
          fi
          if grep -q '^NO_PORT' remote.out; then
            echo "::error::Could not determine PORT for $SVC from PM2."
            exit 1
          fi
          if grep -q '^NOT_READY' remote.out; then
            echo "::error::$SVC not ready after ${HEALTH_TIMEOUT_SECONDS}s. Full log on the box: $(sed -n 's/^LOG=//p' remote.out)"
            exit 1
          fi
          grep -q '^READY' remote.out || { echo "::error::$SVC deploy did not complete. Full log on the box: $(sed -n 's/^LOG=//p' remote.out)"; exit 1; }
