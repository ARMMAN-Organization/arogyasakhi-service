name: CD Dev

# Redeploys the dev box over SSH with only the services whose code changed.
#
# Also callable — redeploy-dev.yml uses it for manual runs. When `services` is
# empty the affected set is computed; "all" or a comma-separated list overrides it.
#
# HOW IT CONNECTS
# SSH tunnelled through AWS Session Manager: `aws ssm start-session` with the
# AWS-StartSSHSession document as an ssh ProxyCommand. The security group has NO
# inbound tcp/22 rule — the tunnel terminates at the box's own local sshd, which
# must therefore stay running. Disabling sshd as "hardening" breaks every deploy
# with no security-group change to point at. Targets are instance IDs, not hosts.
#
# WHY THE LOGIC RUNS ON THE BOX, NOT THE RUNNER
# Affected-detection needs Nx and node_modules. The box already has both, so the
# runner stays a thin driver and we skip a ~3min `npm ci` on every deploy. The
# runner never checks the repo out at all.
#
# SSH USER: must be the user that owns the PM2 daemon (ssm-user) — PM2's daemon is
# per-user, so connecting as anyone else finds an empty process list and every
# reload fails with "process not found".

on:
  push:
    branches: [develop]
  workflow_call:
    inputs:
      services:
        description: 'Empty = only what changed. "all", or a comma-separated list of service names.'
        type: string
        required: false
        default: ''

# id-token is unused while AWS access keys are in play, but is what
# configure-aws-credentials needs to request a short-lived token once the account
# switches to OIDC federation. Declared here — and mirrored in redeploy-dev.yml,
# because a reusable workflow cannot grant itself more than its caller allows —
# so that swap is a credentials change only.
permissions:
  contents: read
  id-token: write

# Never cancel a deploy in flight, and never run two at once: both would race
# `git reset --hard` in the same directory on the same box. Queue instead.
concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  DEV_WORKSPACE: ${{ vars.DEV_WORKSPACE || '/opt/dev/armaan/arogyasakhi-service' }}
  # PM2 runs the services via `nx serve` in fork mode, so a reload restarts a
  # webpack dev server that must rebuild before it listens. Measured at 12s for
  # auth-service on an otherwise-quiet box; the margin is for the case where a
  # shared-lib change has every watcher rebuilding at once and the box is
  # contended. Too tight fails a healthy deploy; too loose only delays reporting
  # a broken one.
  HEALTH_TIMEOUT_SECONDS: 120
  # Was 15 when this connected straight to tcp/22. Establishing the tunnel now
  # also covers AWS CLI start-up, the StartSession API call, launching
  # session-manager-plugin and the websocket handshake — so a direct-connect
  # timeout fails intermittently and looks like a network fault rather than a
  # too-tight setting.
  SSH_CONNECT_TIMEOUT: 60

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # Duplicated verbatim in the deploy job below. Kept inline rather than
      # extracted to a composite action, because a local action resolves from the
      # workspace and would force `actions/checkout` into a workflow that
      # deliberately never checks out (see the header).
      - name: Set up SSH over Session Manager
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
          DEV_USER: ${{ secrets.DEV_USER || 'ssm-user' }}
        run: |
          set -euo pipefail
          [ -n "${DEV_INSTANCE_ID:-}" ] || { echo "::error::Variable DEV_INSTANCE_ID is empty or unset."; exit 1; }
          [ -n "${DEV_SSH_KEY:-}" ]     || { echo "::error::Secret DEV_SSH_KEY is empty or unset."; exit 1; }

          # Not preinstalled on ubuntu-latest, and the ProxyCommand below cannot
          # work without it — `aws ssm start-session` shells out to this binary.
          curl -fsS -o /tmp/session-manager-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
            || { echo "::error::Could not download session-manager-plugin."; exit 1; }
          sudo dpkg -i /tmp/session-manager-plugin.deb >/dev/null
          # Positive confirmation the binary runs. Without it, a bad install
          # surfaces later as `ssh: Connection closed` from the ProxyCommand,
          # which reads as a network or IAM problem rather than a missing plugin.
          session-manager-plugin --version

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # %h/%p must reach ssh unexpanded — it substitutes the target and port.
          # ServerAliveInterval keeps bytes moving because Session Manager closes
          # an idle channel, and the resolve step below sits quiet through an Nx
          # build. accept-new rather than a pinned key: the SSM channel already
          # authenticates the target by instance ID through IAM, so the
          # internet-MITM case a pinned host key defended against is gone.
          cat > ~/.ssh/config <<'CFG'
          Host i-* mi-*
            ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
            ServerAliveInterval 30
            ServerAliveCountMax 10
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

          # Replaces the old ssh-keyscan probe, which cannot run through a
          # ProxyCommand. Stronger anyway: it exercises credentials, IAM, the SSM
          # agent, the tunnel and the key at once, so a misconfiguration fails
          # here with a named cause instead of as a mid-deploy disconnect.
          ssh -o BatchMode=yes -o ConnectTimeout="$SSH_CONNECT_TIMEOUT" \
              -i ~/.ssh/id_deploy "$DEV_USER@$DEV_INSTANCE_ID" true \
            || { echo "::error::Cannot reach $DEV_INSTANCE_ID over Session Manager. Check, in order: the AWS credentials allow ssm:StartSession on this instance and on the AWS-StartSSHSession document; the agent is Online (aws ssm describe-instance-information); sshd is running on the box; DEV_SSH_KEY is present in ${DEV_USER}'s authorized_keys."; exit 1; }

      - name: Sync workspace and resolve services to deploy
        id: resolve
        env:
          DEV_INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
          DEV_USER: ${{ secrets.DEV_USER || 'ssm-user' }}
          SERVICES_INPUT: ${{ inputs.services }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Values are prefixed onto the remote script with %q rather than
          # interpolated into an ssh argument, so quoting can't break and nothing
          # lands in the box's process list.
          {
            printf 'WORKSPACE=%q\n' "$DEV_WORKSPACE"
            printf 'REQUESTED=%q\n' "${SERVICES_INPUT:-}"
            printf 'REF_NAME=%q\n'  "$REF_NAME"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$WORKSPACE"

          # The box's current HEAD *is* what is deployed, so it is the only
          # trustworthy base. Captured before fetching. Deliberately not
          # nrwl/nx-set-shas: that keys off the last *successful run*, so one
          # failed deploy would leave those services looking already-shipped and
          # they would never be redeployed.
          base=$(git rev-parse HEAD)
          git fetch origin "$REF_NAME" >&2
          # FETCH_HEAD rather than the triggering SHA: if runs queued behind the
          # concurrency group, deploying the newest commit is correct, and the
          # superseded run then sees base == target and does nothing.
          target=$(git rev-parse FETCH_HEAD)
          echo "base=$base target=$target" >&2

          # No `git clean` anywhere: the box legitimately holds untracked files
          # (ecosystem.config.js — PM2's own config — create_envs.py, notes).
          git reset --hard "$target" >&2

          if git diff --name-only "$base" "$target" | grep -qx 'package-lock.json'; then
            echo "LOCKFILE_CHANGED=1"
          fi

          all_apps=$(npx nx show projects --type app --json 2>/dev/null)
          requested=$(printf '%s' "$REQUESTED" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')

          if [ "$requested" = 'all' ]; then
            apps="$all_apps"
          elif [ -n "$requested" ]; then
            apps=$(printf '%s' "$requested" \
              | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | unique')
            unknown=$(jq -nc --argjson w "$apps" --argjson h "$all_apps" '$w - $h')
            if [ "$(jq 'length' <<<"$unknown")" -gt 0 ]; then
              echo "UNKNOWN=$(jq -r 'join(", ")' <<<"$unknown")"
              exit 1
            fi
          elif [ "$base" = "$target" ]; then
            apps='[]'
          else
            apps=$(npx nx show projects --affected --type app --base="$base" --head="$target" --json 2>/dev/null)
          fi

          # `nx serve` needs these built; documented prerequisite of the box's
          # ecosystem.config.js. Once per run, not once per service. Nx caches it,
          # so it is near-free when the libs did not change.
          if [ "$(jq 'length' <<<"$apps")" -gt 0 ]; then
            npx nx run-many -t build --projects=service-commons,core >&2
          fi

          echo "APPS_JSON=$apps"
          REMOTE
          } | ssh -o BatchMode=yes -o ConnectTimeout="$SSH_CONNECT_TIMEOUT" -i ~/.ssh/id_deploy \
                "$DEV_USER@$DEV_INSTANCE_ID" 'bash -l -s' > remote.out || {
                  echo "::error::Remote resolve step failed."; cat remote.out; exit 1;
                }

          cat remote.out

          if grep -q '^LOCKFILE_CHANGED=1' remote.out; then
            echo "::warning::package-lock.json changed. npm ci is deliberately not run — the box is on Node 24 while CI pins 20.11.0, and installing there is what causes lockfile drift. If a service fails to boot on a missing dependency, install manually."
          fi

          apps=$(sed -n 's/^APPS_JSON=//p' remote.out)
          [ -n "$apps" ] || { echo "::error::Could not resolve the app list."; exit 1; }

          count=$(jq 'length' <<<"$apps")
          echo "Deploying ($count): $(jq -r 'join(", ")' <<<"$apps")"

          # env_secret is derived here because GitHub expressions have no
          # upper-casing function and so cannot turn "auth-service" into
          # ENV_AUTH_SERVICE on their own.
          matrix=$(jq -c '{
            include: [ .[] | {
              service: .,
              env_secret: ("ENV_" + (. | ascii_upcase | gsub("-"; "_")))
            } ]
          }' <<<"$apps")

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # Sequential: the box was at 81.9% RAM with everything idle, so parallel
      # webpack rebuilds risk an OOM. fail-fast off so one bad service does not
      # strand the rest un-deployed.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # Duplicated from the detect job above — see the comment there for why it is
      # not a composite action. Keep the two copies in step.
      - name: Set up SSH over Session Manager
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
          DEV_USER: ${{ secrets.DEV_USER || 'ssm-user' }}
        run: |
          set -euo pipefail
          [ -n "${DEV_INSTANCE_ID:-}" ] || { echo "::error::Variable DEV_INSTANCE_ID is empty or unset."; exit 1; }
          [ -n "${DEV_SSH_KEY:-}" ]     || { echo "::error::Secret DEV_SSH_KEY is empty or unset."; exit 1; }

          curl -fsS -o /tmp/session-manager-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
            || { echo "::error::Could not download session-manager-plugin."; exit 1; }
          sudo dpkg -i /tmp/session-manager-plugin.deb >/dev/null
          # Positive confirmation the binary runs. Without it, a bad install
          # surfaces later as `ssh: Connection closed` from the ProxyCommand,
          # which reads as a network or IAM problem rather than a missing plugin.
          session-manager-plugin --version

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          cat > ~/.ssh/config <<'CFG'
          Host i-* mi-*
            ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
            ServerAliveInterval 30
            ServerAliveCountMax 10
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

          ssh -o BatchMode=yes -o ConnectTimeout="$SSH_CONNECT_TIMEOUT" \
              -i ~/.ssh/id_deploy "$DEV_USER@$DEV_INSTANCE_ID" true \
            || { echo "::error::Cannot reach $DEV_INSTANCE_ID over Session Manager. See the detect job for the checklist."; exit 1; }

      - name: Upload .env from GitHub secret
        env:
          # Written to a file and scp'd — never passed as an ssh/scp argument,
          # where it would be visible in `ps` to every user on the box.
          ENV_BODY: ${{ secrets[matrix.env_secret] }}
          DEV_INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
          DEV_USER: ${{ secrets.DEV_USER || 'ssm-user' }}
          SVC: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_BODY:-}" ]; then
            echo "::warning::$SVC: secret ${{ matrix.env_secret }} is not set — reloading against the .env already on the box."
            exit 0
          fi
          umask 077
          printf '%s\n' "$ENV_BODY" > env.upload
          scp -o BatchMode=yes -o ConnectTimeout="$SSH_CONNECT_TIMEOUT" -i ~/.ssh/id_deploy env.upload \
            "$DEV_USER@$DEV_INSTANCE_ID:$DEV_WORKSPACE/apps/$SVC/.env"
          ssh -o BatchMode=yes -o ConnectTimeout="$SSH_CONNECT_TIMEOUT" -i ~/.ssh/id_deploy "$DEV_USER@$DEV_INSTANCE_ID" \
            "chmod 600 '$DEV_WORKSPACE/apps/$SVC/.env'"
          rm -f env.upload
          echo "Wrote apps/$SVC/.env from ${{ matrix.env_secret }}"

      - name: Reload and wait for readiness
        env:
          DEV_INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
          DEV_USER: ${{ secrets.DEV_USER || 'ssm-user' }}
          SVC: ${{ matrix.service }}
        run: |
          set -euo pipefail
          {
            printf 'WORKSPACE=%q\n' "$DEV_WORKSPACE"
            printf 'SVC=%q\n'       "$SVC"
            printf 'TIMEOUT=%q\n'   "$HEALTH_TIMEOUT_SECONDS"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$WORKSPACE"

          # A service present in git but not in PM2 has never been bootstrapped on
          # this box. Auto-starting it would boot it with no .env straight into its
          # Zod fail-fast, so skip — but loudly, because a silently never-deployed
          # service is the worst outcome here.
          if ! pm2 describe "$SVC" >/dev/null 2>&1; then
            echo "SKIPPED_NOT_IN_PM2"
            exit 0
          fi

          # PM2's own env is the authoritative port: it is what injects PORT into
          # each service, so no port table is needed anywhere here.
          port=$(pm2 jlist | jq -r --arg s "$SVC" '.[] | select(.name == $s) | .pm2_env.env.PORT // empty')
          if [ -z "$port" ]; then
            echo "NO_PORT"
            exit 1
          fi

          pm2 reload "$SVC" --update-env >&2

          # `pm2 reload` exiting 0 only means the process was signalled, not that
          # the app rebuilt and bound its socket. Health is mounted under the
          # global api/v1 prefix.
          url="http://localhost:$port/api/v1/health/ready"
          deadline=$((SECONDS + TIMEOUT))
          until curl -fsS -o /dev/null "$url"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "NOT_READY $url"
              pm2 logs "$SVC" --lines 40 --nostream >&2 || true
              exit 1
            fi
            sleep 3
          done
          echo "READY $port"
          REMOTE
          } | ssh -o BatchMode=yes -o ConnectTimeout="$SSH_CONNECT_TIMEOUT" -i ~/.ssh/id_deploy \
                "$DEV_USER@$DEV_INSTANCE_ID" 'bash -l -s' | tee remote.out || true

          if grep -q '^SKIPPED_NOT_IN_PM2' remote.out; then
            echo "::warning::$SVC is not registered in PM2 — skipped. Bootstrap it once on the box with pm2 start, then it will deploy normally."
            exit 0
          fi
          if grep -q '^NO_PORT' remote.out; then
            echo "::error::Could not determine PORT for $SVC from PM2."
            exit 1
          fi
          if grep -q '^NOT_READY' remote.out; then
            echo "::error::$SVC not ready after ${HEALTH_TIMEOUT_SECONDS}s."
            exit 1
          fi
          grep -q '^READY' remote.out || { echo "::error::$SVC deploy did not complete."; exit 1; }
